services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Versão fixada: imagens mais novas do LocalStack exigem auth token.
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      # Scripts em ready.d rodam quando o LocalStack fica pronto: criam as filas.
      - ./docker/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Só fica "healthy" depois que o script de init criou a fila principal.
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
